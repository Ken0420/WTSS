<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Head includes -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="path/to/styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero image section -->
    <section>
        <section>
            <section class="hero-container overflow-hidden">
                <section class="example-css-id-gradient"></section>
                <div class="hero-gradient-background-light d-none d-md-block"></div>
                <div class="hero-gradient-background d-none d-lg-block"></div>

                <!-- Angled shape containers start -->
                <div class="shape-backgrounds-container">
                    <div class="shape-graphic-container-left">
                        <div class="shape-graphic-left-side-a"></div>
                        <div class="shape-graphic-left-side-a1 d-none d-xl-block"></div>
                        <div class="shape-graphic-left-side-a-extra-color-bar d-none d-xl-block"></div>
                        <div class="shape-graphic-left-side-a-last d-none d-xl-block"></div>
                    </div>
                    <div class="shape-right">
                        <div class="shape-graphic-left-side-a"></div>
                        <div class="shape-graphic-left-side-a1 d-none d-xl-block"></div>
                        <div class="shape-graphic-left-side-a-extra-color-bar d-none d-xl-block"></div>
                        <div class="shape-graphic-left-side-a-last d-none d-xl-block"></div>
                    </div>
                </div>
                <!-- Angled shape containers end -->

                <!-- Custom spacing -->
                <div class="pt-4 mt-5"></div>
                <div class="pt-3 pt-sm-2"></div>
                <div class="pt-0 pt-sm-2 pt-lg-4"></div>
            </section>
        </section>
    </section>
</body>
</html>
