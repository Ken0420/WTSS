<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static template preview</title>
  </head>
  <body>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <!-- Dynamic SEO metadata omitted from static export. -->
    <!-- Dynamic favicon links omitted from static export. -->

    <!-- web fonts CDN -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,400i,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Tracking pixel omitted from static export. -->

    <!-- flag cdn -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.1.0/css/flag-icon.min.css"
      rel="stylesheet"
    />

    <!-- custom styles -->
    <link rel="stylesheet" type="text/css" href="../../assets/css/base.css" />

    <script>
      var cookieFunctions = {
        setCookie: function (name, value, days) {
          var expires = "";
          if (days) {
            var date = new Date();
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
            expires = "; expires=" + date.toUTCString();
          }
          document.cookie = name + "=" + (value || "") + expires + "; path=/";
        },
        getCookie: function (name) {
          var prefix = name + "=";
          var cookies = document.cookie.split(";");
          for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.indexOf(prefix) === 0)
              return cookie.substring(prefix.length);
          }
          return null;
        },
        eraseCookie: function (name) {
          document.cookie = name + "=; Max-Age=-99999999; path=/";
        },
      };
    </script>
  </body>
</html>
